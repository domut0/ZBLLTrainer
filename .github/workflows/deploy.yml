name: Deploy Lock In to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          # setup-node v5 added automatic caching driven by a `packageManager`
          # field in package.json. This repo has no such field, so the explicit
          # cache setting is still what does the work — keep it rather than rely
          # on detection.
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      # upload-pages-artifact v4 stopped including dotfiles. `dist/` contains
      # none — checked, including recursively — so nothing is lost here. A future
      # need for one (a .nojekyll, say) means building the artifact by hand
      # instead, per the action's README.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
